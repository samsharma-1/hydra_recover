<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HYDRA RECOVER</title>
    <script type="text/javascript">
      // Redirect to root with hash path for GitHub Pages SPA support
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') + '/#/' +
        l.pathname.slice(1).split('/').slice(1).join('/') +
        (l.search ? '?' + l.search.slice(1) : '')
      );
    </script>
  </head>
  <body>
  </body>
</html>
